name: C++ CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
      commit_count: ${{ steps.bump_version.outputs.commit_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get commit count and tag
        id: bump_version
        run: |
          commit_count=$(git rev-list --count HEAD)
          new_tag="v1.0.$commit_count"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
          echo "Current version will be: $new_tag"

  build-linux:
    runs-on: ubuntu-latest
    needs: bump-version
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      
      - name: Build project
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}
      
      - name: Run tests (if any)
        run: |
          cd build
          ctest --output-on-failure || echo "No tests found or tests failed"
      
      - name: Create package
        run: |
          cd build
          cpack -G DEB
      
      - name: List generated packages
        run: |
          ls -la build/*.deb 2>/dev/null || echo "No .deb packages found"
          ls -la build/*.tar.gz 2>/dev/null || echo "No .tar.gz packages found"
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ needs.bump-version.outputs.new_tag }}
          path: |
            build/*.deb
            build/*.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: bump-version
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DPROJECT_VERSION_PATCH=${{ needs.bump-version.outputs.commit_count }} -A x64

      - name: Build
        run: |
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }}
      
      - name: Create Windows package
        run: |
          cd build
          mkdir -p package
          copy ${{ env.BUILD_TYPE }}\lab3.exe package\
          
          # Check if 7z is available, if not use Compress-Archive
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip lab3-${{ needs.bump-version.outputs.new_tag }}-windows.zip package\*
          } else {
            Compress-Archive -Path package\* -DestinationPath "lab3-${{ needs.bump-version.outputs.new_tag }}-windows.zip"
          }
      
      - name: List generated files
        run: |
          dir build\*.zip
          dir build\package\
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-${{ needs.bump-version.outputs.new_tag }}
          path: build/*.zip
          if-no-files-found: error

  create-release:
    if: github.ref == 'refs/heads/main'
    needs: [bump-version, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          find artifacts -type f -name "*" | head -20
          echo "Total files found:"
          find artifacts -type f -name "*" | wc -l
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag }}
          name: Release ${{ needs.bump-version.outputs.new_tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}